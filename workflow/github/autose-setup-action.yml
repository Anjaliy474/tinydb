name: AutoSE setup
description: Python and the packages the AutoSE harness needs.
inputs:
  extras:
    description: Extra pip packages (e.g. pytest mypy for jobs that run the tests)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "anthropic==2.12.0" "pyyaml>=6,<7" ${{ inputs.extras }}
