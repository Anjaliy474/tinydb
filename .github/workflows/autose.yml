# AutoSE: turn an issue into a tested, reviewed pull request.
# A maintainer starts it with the label `autose` or a comment starting with `/autose`.
# Design: architecture/decisions (ADR-001 to ADR-010).

name: AutoSE

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Nothing by default; each job asks only for what it needs (ADR-005).
permissions: {}

jobs:
  intake:
    # Cheap filter first, so ordinary comments don't even start a runner.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'autose') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/autose'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.intake.outputs.proceed }}
      issue: ${{ steps.intake.outputs.issue }}
      rounds_left: ${{ steps.intake.outputs.rounds_left }}
      first_round: ${{ steps.intake.outputs.first_round }}
      mode: ${{ steps.intake.outputs.mode }}
      pr: ${{ steps.intake.outputs.pr }}
      review_model: ${{ steps.intake.outputs.review_model }}
      review_prompt: ${{ steps.intake.outputs.review_prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/autose-setup
      - id: intake
        run: python -m autose.intake
        env:
          PYTHONPATH: workflow
          GH_TOKEN: ${{ github.token }}

  pipeline:
    needs: intake
    if: needs.intake.outputs.proceed == 'true' && needs.intake.outputs.mode == 'full'
    # One lock per issue around the whole pipeline, so two runs for the same issue
    # (from the issue and from its PR) never interleave (ADR-010).
    concurrency:
      group: autose-issue-${{ needs.intake.outputs.issue }}
      cancel-in-progress: false
    # The most any job inside may use; each job narrows it further.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/autose-pipeline.yml
    with:
      issue: ${{ needs.intake.outputs.issue }}
      rounds_left: ${{ needs.intake.outputs.rounds_left }}
      first_round: ${{ needs.intake.outputs.first_round }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # `/autose review` on any PR: only the independent reviewer runs (seeded PRs, experiments).
  # Same isolation as the pipeline's review job: read-only code, no artifacts from other stages.
  review-only:
    needs: intake
    if: needs.intake.outputs.proceed == 'true' && needs.intake.outputs.mode == 'review'
    concurrency:
      group: autose-pr-${{ needs.intake.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, issues: read, pull-requests: write}
    env:
      PYTHONPATH: ${{ github.workspace }}/harness/workflow
      AUTOSE_REPO: ${{ github.workspace }}/repo
      AUTOSE_CONFIG: ${{ github.workspace }}/harness/.autose.yml
      AUTOSE_ARTIFACTS: ${{ github.workspace }}-artifacts
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {path: harness, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          path: repo
          ref: refs/pull/${{ needs.intake.outputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: ./harness/.github/actions/autose-setup
        with: {extras: "pytest"}
      - id: review
        working-directory: repo
        run: python -m autose.review --issue "${{ needs.intake.outputs.issue }}" --pr "${{ needs.intake.outputs.pr }}" --round 1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          AUTOSE_REVIEWER_MODEL: ${{ needs.intake.outputs.review_model }}
          AUTOSE_REVIEWER_PROMPT: ${{ needs.intake.outputs.review_prompt }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-pr-${{ needs.intake.outputs.pr }}
          path: ${{ env.AUTOSE_ARTIFACTS }}
          if-no-files-found: ignore
